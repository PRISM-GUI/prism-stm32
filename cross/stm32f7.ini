# STM32F746NG (Cortex-M7 at 216 MHz) — the STM32F746G-DISCO board.
# Unlike the H7 (fpv5-d16, double precision), this part's FPU is single precision only
# (fpv5-sp-d16): the ABI is the same hard-float one, so the same libraries link, but the
# compiler must not emit double-precision VFP instructions.
# The flags are otherwise the H7's: PRISM's embedded paths do use C++ exceptions (core/error_hub,
# audio/output), so -fno-exceptions/-fno-rtti are not options, and newlib-nano lacks the
# std::condition_variable the platform layer needs.
[binaries]
c = '@DIRNAME@/../scripts/arm-gcc'
cpp = '@DIRNAME@/../scripts/arm-g++'
ar = 'arm-none-eabi-ar'
strip = 'arm-none-eabi-strip'
objcopy = 'arm-none-eabi-objcopy'
size = 'arm-none-eabi-size'

[built-in options]
b_staticpic = false
# Asserts off: NDEBUG drops PRISM's debug-only diagnostics (assert() plus the #ifndef NDEBUG
# blocks) and the assert machinery of libstdc++/newlib, worth ~55 KiB of flash on this board.
# PRISM's always-on checks stay: they are explicit std::abort() paths, not asserts.
b_ndebug = 'true'
c_args = ['-mcpu=cortex-m7', '-mthumb', '-mfpu=fpv5-sp-d16', '-mfloat-abi=hard', '-ffunction-sections', '-fdata-sections']
cpp_args = ['-mcpu=cortex-m7', '-mthumb', '-mfpu=fpv5-sp-d16', '-mfloat-abi=hard', '-ffunction-sections', '-fdata-sections']
c_link_args = ['-mcpu=cortex-m7', '-mthumb', '-mfpu=fpv5-sp-d16', '-mfloat-abi=hard', '--specs=nosys.specs', '-Wl,--gc-sections']
cpp_link_args = ['-mcpu=cortex-m7', '-mthumb', '-mfpu=fpv5-sp-d16', '-mfloat-abi=hard', '--specs=nosys.specs', '-Wl,--gc-sections']

[host_machine]
system = 'none'
cpu_family = 'arm'
cpu = 'cortex-m7'
endian = 'little'
