# STM32H7B3 (Cortex-M7, double-precision FPU), bare metal, the xPack/Arm GNU toolchain.
[binaries]
c = '@DIRNAME@/../scripts/arm-gcc'
cpp = '@DIRNAME@/../scripts/arm-g++'
ar = 'arm-none-eabi-ar'
strip = 'arm-none-eabi-strip'
objcopy = 'arm-none-eabi-objcopy'
size = 'arm-none-eabi-size'

[built-in options]
# PIC code wants __tls_get_addr for thread_local (in PRISM's libraries too: a project's
# default_options do not reach its subprojects); the firmware has no dynamic loader.
b_staticpic = false
c_args = ['-mcpu=cortex-m7', '-mthumb', '-mfpu=fpv5-d16', '-mfloat-abi=hard', '-ffunction-sections', '-fdata-sections']
cpp_args = ['-mcpu=cortex-m7', '-mthumb', '-mfpu=fpv5-d16', '-mfloat-abi=hard', '-ffunction-sections', '-fdata-sections']
c_link_args = ['-mcpu=cortex-m7', '-mthumb', '-mfpu=fpv5-d16', '-mfloat-abi=hard', '--specs=nosys.specs', '-Wl,--gc-sections']
cpp_link_args = ['-mcpu=cortex-m7', '-mthumb', '-mfpu=fpv5-d16', '-mfloat-abi=hard', '--specs=nosys.specs', '-Wl,--gc-sections']

[host_machine]
system = 'none'
cpu_family = 'arm'
cpu = 'cortex-m7'
endian = 'little'
